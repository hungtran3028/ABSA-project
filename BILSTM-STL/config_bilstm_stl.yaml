# BiLSTM Sequential Single-Task Learning Configuration
# ========================================================================
# Uses PhoBERT as frozen feature extractor (NOT static embedding table)
# Two-stage: Stage 1 (AD) + Stage 2 (SC) with separate BiLSTM models
# ========================================================================

paths:
  data_dir: "BILSTM-STL/data"
  train_file: "BILSTM-STL/data/train_multilabel.csv"
  validation_file: "BILSTM-STL/data/validation_multilabel.csv"
  test_file: "BILSTM-STL/data/test_multilabel.csv"
  ad_output_dir: "BILSTM-STL/models/aspect_detection"
  sc_output_dir: "BILSTM-STL/models/sentiment_classification"
  final_results_dir: "BILSTM-STL/results/two_stage_training"

model:
  # PhoBERT feature extractor
  embedding_model: "vinai/phobert-base-v2"

  # Architecture (matches old notebook that achieved SC=95%)
  embedding_dim: 768
  lstm_hidden_size: 256
  lstm_num_layers: 2
  lstm_dropout: 0.3
  bidirectional: true

  # Task settings
  num_aspects: 11
  num_sentiments: 3
  max_length: 256

aspect_names:
  - Battery
  - Camera
  - Performance
  - Display
  - Design
  - Packaging
  - Price
  - Shop_Service
  - Shipping
  - General
  - Others

sentiment_labels:
  positive: 0
  negative: 1
  neutral: 2

training:
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 32
  learning_rate: 1.0e-3
  weight_decay: 0.01
  max_grad_norm: 1.0
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.1
  fp16: true
  logging_steps: 50

# Reproducibility (matched to Transformer models = seed 100)
reproducibility:
  seed: 100
  deterministic: true

# Sequential training settings
two_stage:
  train_ad_first: true
  train_sc_after: true

  # Stage 1: Aspect Detection (matched to old notebook = 20 epochs, patience 5)
  aspect_detection:
    epochs: 20
    metric_for_best_model: "f1_macro"
    early_stopping_patience: 5

  # Stage 2: Sentiment Classification (matched to old notebook = 20 epochs, patience 5)
  sentiment_classification:
    epochs: 20
    metric_for_best_model: "f1_macro"
    early_stopping_patience: 5
