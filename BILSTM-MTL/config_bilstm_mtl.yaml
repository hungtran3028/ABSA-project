# BiLSTM Multi-Task Learning Configuration
# ========================================================================
# Uses PhoBERT as frozen feature extractor (NOT static embedding table)
# BiLSTM receives pre-computed contextualized embeddings (last_hidden_state)
#
# Model: PhoBERT → BiLSTM → Additive Attention → Shared Dense → 2 Heads
# Loss: Combined loss = α * Loss_AD + β * Loss_SC
# ========================================================================

paths:
  data_dir: "BILSTM-MTL/data"
  train_file: "BILSTM-MTL/data/train_multilabel.csv"
  validation_file: "BILSTM-MTL/data/validation_multilabel.csv"
  test_file: "BILSTM-MTL/data/test_multilabel.csv"
  output_dir: "BILSTM-MTL/models/mtl"
  final_results_dir: "BILSTM-MTL/results"

model:
  # PhoBERT feature extractor
  embedding_model: "vinai/phobert-base-v2"

  # Architecture (matches old notebook that achieved SC=95%)
  embedding_dim: 768 # PhoBERT output dimension
  lstm_hidden_size: 256
  lstm_num_layers: 2
  lstm_dropout: 0.2
  classifier_dropout: 0.2
  bidirectional: true

  # Task settings
  num_aspects: 11
  num_sentiments: 3
  max_length: 256

aspect_names:
  - Battery
  - Camera
  - Performance
  - Display
  - Design
  - Packaging
  - Price
  - Shop_Service
  - Shipping
  - General
  - Others

sentiment_labels:
  positive: 0
  negative: 1
  neutral: 2

training:
  # Batch sizes (matched to old notebook)
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 32

  # Optimizer
  learning_rate: 5.0e-4
  weight_decay: 0.01
  max_grad_norm: 1.0

  # Scheduler
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.1

  # Training duration
  num_train_epochs: 25

  # Mixed precision
  fp16: true

  # Early stopping (matched to old notebook = patience 5)
  early_stopping_patience: 5
  early_stopping_threshold: 0.001

  # Logging
  logging_steps: 50

# Multi-task learning settings
multi_task:
  loss_weight_ad: 1.0
  loss_weight_sc: 1.0
  sc_loss_masking: true

  aspect_detection:
    metric: "f1_macro"

  sentiment_classification:
    use_focal_loss: true
    focal_gamma: 2
    focal_alpha: "auto"
    metric: "f1_macro"

  best_model_metric: "combined"

# Reproducibility (matched to Transformer models = seed 100)
reproducibility:
  seed: 100
  deterministic: true

general:
  log_level: "info"
  save_predictions: true
